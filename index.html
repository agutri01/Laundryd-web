<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Prevent Vite HMR WebSocket connection errors in environments without HMR proxy
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite-hmr')))) {
              const listeners = new Map();
              return {
                OPEN: 1,
                CLOSED: 3,
                readyState: 1,
                url: String(url),
                protocol: 'vite-hmr',
                addEventListener(type, cb) {
                  if (type === 'open') {
                    setTimeout(() => {
                      try { cb({ type: 'open' }); } catch (e) {}
                    }, 5);
                  }
                  if (!listeners.has(type)) listeners.set(type, new Set());
                  listeners.get(type).add(cb);
                },
                removeEventListener(type, cb) {
                  if (listeners.has(type)) listeners.get(type).delete(cb);
                },
                send() {},
                close() {
                  this.readyState = 3;
                  const closeCbs = listeners.get('close');
                  if (closeCbs) {
                    closeCbs.forEach(cb => {
                      try { cb({ type: 'close', wasClean: true, code: 1000 }); } catch (e) {}
                    });
                  }
                }
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global safeguard against unhandled WebSocket rejections
        window.addEventListener('unhandledrejection', function(event) {
          const reason = String(event.reason?.message || event.reason || '');
          if (
            reason.includes('WebSocket closed without opened') ||
            reason.includes('failed to connect to websocket') ||
            reason.includes('vite-hmr')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          if (
            msg.includes('WebSocket closed without opened') ||
            msg.includes('failed to connect to websocket') ||
            msg.includes('vite-hmr')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        const origError = console.error;
        console.error = function(...args) {
          const joined = args.map(a => String(a?.message || a)).join(' ');
          if (
            joined.includes('failed to connect to websocket') ||
            joined.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
